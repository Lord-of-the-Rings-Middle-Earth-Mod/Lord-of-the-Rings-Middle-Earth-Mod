name: Add Stone Type
description: Create a new stone type in the VExt Mod
title: "Adding StoneType as stone type to the Mod (Copilot Issue)"
projects:
  - "VExt Mod Issue Board"
type: "Feature"
labels:
  - good first issue
body:
  - type: input
    id: stone_type
    attributes:
      label: Stone Type
      description: Enter the name of the new stone type (e.g., Marble)
      placeholder: stone type
    validations:
      required: true

  - type: textarea
    id: issue_description
    attributes:
      label: Description
      value: "Implement all the stone_type blocks following the Blueslate pattern."
    validations:
      required: true

  - type: textarea
    id: issue_details
    attributes:
      label: Details
      description: Please replace "stone_type" / "StoneType" in the following text with the actual stone type name.
      value: |
        Use BlueslateBlocks.java as the sole reference throughout. Do not deviate from established patterns unless necessary.

        **1. Create StoneTypeBlocks.java**
        - Create a new class `StoneTypeBlocks.java` in the package `com.anedhel.vext.block.stonetypes` (replace StoneType with the actual stone type name, e.g., `MarbleBlocks.java`)
        - Register all needed stone_type blocks and BlockFamilies following the pattern from BlueslateBlocks.java
        - The exact number of blocks and BlockFamilies should match BlueslateBlocks.java — use it as the reference for completeness
        - Create all 9 necessary ModStoneSubSets:
          - POLISHED_STONE_TYPE_SUBSET
          - STONE_TYPE_PILLAR_SUBSET
          - STONE_TYPE_FRIEZE_SUBSET
          - COBBLED_STONE_TYPE_BRICK_SUBSET
          - RUSTIC_STONE_TYPE_BRICK_SUBSET
          - STONE_TYPE_BRICK_SUBSET
          - STONE_TYPE_TILE_SUBSET
          - STONE_TYPE_PAVEMENT_SUBSET
          - FANCY_STONE_TYPE_BRICK_SUBSET
        - Create the main ModStoneSet (STONE_TYPE_SET) that contains all 12 base BlockFamilies and all 9 SubSets
        - Add a `registerStoneTypeBlocks()` method that will be called from ModBlocks

        **2. ModStoneTypes Enum**
        - Add an entry to the `ModStoneTypes` enum in `ModStoneTypes.java`
        - Reference the ModStoneSet created in StoneTypeBlocks.java
        - Follow the pattern: `STONE_TYPE(StoneTypeBlocks.STONE_TYPE_SET, "StoneType");`

        **3. ModBlocks class**
        - Add a call to `StoneTypeBlocks.registerStoneTypeBlocks();` in the `registerModStoneBlocks()` method
        - This ensures all blocks are registered when the mod initializes

        **4. ModItemGroups class**
        - Add `entries.addAll(StoneTypeBlocks.STONE_TYPE_SET.getStoneItemGroupList());` to the VEXT_STONE ItemGroup
        - This makes all stone_type blocks appear in the creative inventory tab

        **5. CHANGELOG.md**
        - Add a line to the CHANGELOG.md under the next release (usually the topmost entry) that stone_type has been added as a stone type
        - Follow the format of existing entries, similar to the existing line for Blueslate

        When those steps are done, the stone type is fully added. DataGen etc. is all automatically handled by iterating over the ModStoneTypes enum.

        You can see an extensive tutorial on how to add a stone type in the following file: https://drive.google.com/file/d/1PPP5iPaxeeUu-IXlhVU_WspjRAf-rYF8/view?usp=sharing

        This issue requires **ALL** of the above mentioned steps to be implemented **completely**. No blocks should be left out and we do not want a systematic approach to the issue, we want the final result.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] All stone_type blocks and BlockFamilies are registered, matching the number and structure of BlueslateBlocks.java
        - [ ] All 9 ModStoneSubSets are created and fully populated
        - [ ] The ModStoneSet (STONE_TYPE_SET) contains all 12 base BlockFamilies and all 9 SubSets
        - [ ] stone_type is registered in the ModStoneTypes enum
        - [ ] `registerStoneTypeBlocks()` is called in ModBlocks
        - [ ] All stone_type blocks appear in the VEXT_STONE item group in the creative inventory
        - [ ] All stone_type blocks are mineable with a pickaxe
        - [ ] All stone_type blocks and their variants (stairs, slab, wall) drop themselves correctly, including double-slab behaviour
        - [ ] All stone_type blocks have correct translations and appear with correct names in-game
        - [ ] All crafting, smelting, and stonecutting recipes are present and functional
        - [ ] All stone_type blocks render correctly in-game with the appropriate textures and overlays
        - [ ] CHANGELOG.md has been updated
        - [ ] No existing stone type functionality is broken by the changes
    validations:
      required: true
