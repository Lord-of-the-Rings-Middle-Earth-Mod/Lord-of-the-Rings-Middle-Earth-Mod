name: Add Stone Type
description: Create a new stone type in the VExt Mod
title: "Adding StoneType as stone type to the Mod (Copilot Issue)"
projects:
  - "VExt Mod Issue Board"
type: "Feature"
labels:
- good first issue
body:
  - type: input
    id: stone_type
    attributes:
      label: Stone Type
      description: Enter the name of the new stone type (e.g., marble)
      placeholder: stone type
    validations:
      required: true
  - type: textarea
    id: issue_description
    attributes:
      label: Task
      description: Please replace "stone_type" in the following text
      value: "# Task:\nImplement all the stone_type blocks following the blueslate pattern.\n\n# How to do this:\n\n## 1. Create StoneTypeBlocks.java class\n- Create a new class `StoneTypeBlocks.java` in the package `com.anedhel.vext.block.stonetypes` (replace StoneType with the actual stone type name, e.g., MarbleBlocks.java)\n- Register all needed stone_type blocks and BlockFamilies following the pattern from BlueslateBlocks.java\n- This includes approximately 793 blocks and 228 BlockFamilies\n- Create all 9 necessary ModStoneSubSets:\n  - POLISHED_STONE_TYPE_SUBSET\n  - STONE_TYPE_PILLAR_SUBSET\n  - STONE_TYPE_FRIEZE_SUBSET\n  - COBBLED_STONE_TYPE_BRICK_SUBSET\n  - RUSTIC_STONE_TYPE_BRICK_SUBSET\n  - STONE_TYPE_BRICK_SUBSET\n  - STONE_TYPE_TILE_SUBSET\n  - STONE_TYPE_PAVEMENT_SUBSET\n  - FANCY_STONE_TYPE_BRICK_SUBSET\n- Create the main ModStoneSet (STONE_TYPE_SET) that contains all 12 base BlockFamilies and all 9 SubSets\n- You can copy-paste the blueslate registrations and change the names from blueslate to stone_type\n- Add a `registerStoneTypeBlocks()` method that will be called from ModBlocks\n\n## 2. ModStoneTypes Enum\n- Add an entry to the ModStoneTypes enum in the file `ModStoneTypes.java`\n- Reference the ModStoneSet created in StoneTypeBlocks.java\n- Follow the pattern: `STONE_TYPE(StoneTypeBlocks.STONE_TYPE_SET, \"StoneType\");`\n\n## 3. ModBlocks class\n- Add a call to `StoneTypeBlocks.registerStoneTypeBlocks();` in the `registerModStoneBlocks()` method\n- This ensures all blocks are registered when the mod initializes\n\n## 4. ModItemGroups class\n- Add `entries.addAll(StoneTypeBlocks.STONE_TYPE_SET.getStoneItemGroupList());` to the VEXT_STONE ItemGroup\n- This makes all stone_type blocks appear in the creative inventory tab\n\n## 5. CHANGELOG.md\n- Add a line to the CHANGELOG.md under the next release (usually the topmost entry) that stone_type has been added as stone type\n- Follow the format of existing entries, similar to the existing line for blueslate\n\nWhen those steps are done, the stone type is fully added. DataGen etc. is all automatically done by iterating over the ModStoneTypes Enum. Each stone type should contain about 793 blocks, 228 Block Families, and 9 ModStoneSubSets.\n\nYou can see an extensive Tutorial on how to add a stone type in the following file: https://drive.google.com/file/d/1PPP5iPaxeeUu-IXlhVU_WspjRAf-rYF8/view?usp=sharing\n\nThis issue requires **ALL** of the above mentioned steps to be implemented **completely**. No blocks should be left out and we do not want a systematic approach to the issue, we want the final result."
    validations:
      required: true
