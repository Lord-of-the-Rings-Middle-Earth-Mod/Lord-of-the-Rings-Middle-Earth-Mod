name: Build JAR on Testing

on:
  pull_request_target:
    types: [closed]
    branches:
      - develop

# Replace placeholder values by running the fetch-project-ids.yml workflow_dispatch
# helper, then copying the printed IDs into the variables below.
env:
  PROJECT_ID:        "PLACEHOLDER_PROJECT_ID"
  STATUS_FIELD_ID:   "PLACEHOLDER_STATUS_FIELD_ID"
  STATUS_TESTING_ID: "PLACEHOLDER_STATUS_TESTING_ID"

jobs:
  check-should-build:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      issue_number: ${{ steps.check.outputs.issue_number }}
    steps:
      - name: Check if merged PR has a Testing issue
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // Skip if the PR was not merged
            if (!context.payload.pull_request.merged) {
              console.log('PR was not merged — skipping.');
              core.setOutput('should_build', 'false');
              core.setOutput('issue_number', '');
              return;
            }

            const prNumber = context.payload.pull_request.number;
            console.log(`Merged PR #${prNumber} — checking linked issues…`);

            // Find the linked issue via closingIssuesReferences
            const linkedQuery = `
              query($owner: String!, $repo: String!, $prNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    closingIssuesReferences(first: 25) {
                      nodes {
                        number
                      }
                    }
                  }
                }
              }
            `;

            const linked = await github.graphql(linkedQuery, {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              prNumber,
            });

            const nodes =
              linked?.repository?.pullRequest?.closingIssuesReferences?.nodes ?? [];

            if (nodes.length === 0) {
              console.log('No linked issues found — skipping.');
              core.setOutput('should_build', 'false');
              core.setOutput('issue_number', '');
              return;
            }

            // Use the first linked issue
            const issueNumber = nodes[0].number;
            console.log(`Linked issue: #${issueNumber}`);

            // Query the issue's current Status field value on the project board
            const statusQuery = `
              query($owner: String!, $repo: String!, $issueNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issueNumber) {
                    projectItems(first: 20) {
                      nodes {
                        id
                        project {
                          id
                        }
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            optionId
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const statusResult = await github.graphql(statusQuery, {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issueNumber,
            });

            const projectItems =
              statusResult?.repository?.issue?.projectItems?.nodes ?? [];

            const projectItem = projectItems.find(
              (item) => item.project.id === process.env.PROJECT_ID
            );

            if (!projectItem) {
              console.log(`Issue #${issueNumber} is not on the project board — skipping.`);
              core.setOutput('should_build', 'false');
              core.setOutput('issue_number', '');
              return;
            }

            const statusOptionId = projectItem?.fieldValueByName?.optionId ?? null;
            console.log(`Issue #${issueNumber} status option ID: ${statusOptionId}`);

            if (statusOptionId !== process.env.STATUS_TESTING_ID) {
              console.log('Issue is not in Testing status — skipping.');
              core.setOutput('should_build', 'false');
              core.setOutput('issue_number', '');
              return;
            }

            console.log(`Issue #${issueNumber} is in Testing — triggering build.`);
            core.setOutput('should_build', 'true');
            core.setOutput('issue_number', String(issueNumber));

  build:
    needs: check-should-build
    if: needs.check-should-build.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Extract version information
        id: version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT

      - name: Run DataGen
        run: ./gradlew runDataGen --no-daemon --stacktrace

      - name: Build JAR
        run: ./gradlew build --no-daemon --stacktrace

      - name: Locate and rename JAR
        id: jar
        run: |
          ORIGINAL_BASE=$(grep '^archives_base_name=' gradle.properties | cut -d'=' -f2)
          MOD_VERSION="${{ steps.version.outputs.mod_version }}"
          MC_VERSION="${{ steps.version.outputs.minecraft_version }}"

          # Strip any minecraft-version suffix from the mod version string
          MOD_VERSION_BASE=$(echo "$MOD_VERSION" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+$//')
          ARTIFACT_NAME="${MOD_VERSION_BASE}+${MC_VERSION}-dev"

          BUILT_JAR=$(find build/libs -name "${ORIGINAL_BASE}-${MOD_VERSION}.jar" -type f | head -1)
          if [ -z "$BUILT_JAR" ]; then
            echo "ERROR: Built JAR not found in build/libs"
            ls build/libs/
            exit 1
          fi

          RENAMED_JAR="build/libs/vext-${ARTIFACT_NAME}.jar"
          cp "$BUILT_JAR" "$RENAMED_JAR"
          echo "jar_path=$RENAMED_JAR" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "JAR renamed to: $RENAMED_JAR"

      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.artifact_name }}
          path: ${{ steps.jar.outputs.jar_path }}
          retention-days: 90

      - name: Post comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ needs.check-should-build.outputs.issue_number }}', 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const artifactName = '${{ steps.jar.outputs.artifact_name }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                '🔨 **Test Build Ready**',
                '',
                'This build was triggered automatically when the linked PR was merged and the issue was in the **Testing** status.',
                '',
                `**Artifact:** \`${artifactName}.jar\``,
                `**Built from:** \`develop\` branch at commit \`${sha}\``,
                '',
                `📥 [Download the artifact from this workflow run](${runUrl})`,
                '',
                '_Navigate to the run linked above, open the **Artifacts** section at the bottom of the summary page, and download the JAR._'
              ].join('\n')
            });

            console.log(`Comment posted to issue #${issueNumber}`);
